<script>
const $=id=>document.getElementById(id);
const S="H He Li Be B C N O F Ne Na Mg Al Si P S Cl Ar K Ca Sc Ti V Cr Mn Fe Co Ni Cu Zn Ga Ge As Se Br Kr Rb Sr Y Zr Nb Mo Tc Ru Rh Pd Ag Cd In Sn Sb Te I Xe Cs Ba La Ce Pr Nd Pm Sm Eu Gd Tb Dy Ho Er Tm Yb Lu Hf Ta W Re Os Ir Pt Au Hg Tl Pb Bi Po At Rn Fr Ra Ac Th Pa U Np Pu Am Cm Bk Cf Es Fm Md No Lr Rf Db Sg Bh Hs Mt Ds Rg Cn Nh Fl Mc Lv Ts Og".split(" ");
const N=Array.from("氫氦鋰鈹硼碳氮氧氟氖鈉鎂鋁矽磷硫氯氬鉀鈣鈧鈦釩鉻錳鐵鈷鎳銅鋅鎵鍺砷硒溴氪銣鍶釔鋯鈮鉬鎝釕銠鈀銀鎘銦錫銻碲碘氙銫鋇鑭鈰鐠釹鉕釤銪釓鋱鏑鈥鉺銩鐿鎦鉿鉭鎢錸鋨銥鉑金汞鉈鉛鉍釙砈氡鍅鐳錒釷鏷鈾鎿鈽鋂鋦鉳鉲鑀鐨鍆鍩鐒鑪𨧀𨭎𨨏𨭆䥑鐽錀鎶鉨鈇鏌鉝鿬鿫");
const G=a=>z=>a.includes(z);
const cats=[[G([3,11,19,37,55,87]),"#d6523a"],[G([4,12,20,38,56,88]),"#d98a2b"],[G([9,17,35,53,85,117]),"#b8497f"],[G([2,10,18,36,54,86,118]),"#7a5bd0"],[G([1,6,7,8,15,16,34]),"#2f9e6a"],[G([5,14,32,33,51,52]),"#6f8f2a"],[G([13,31,49,50,81,82,83,84,113,114,115,116]),"#3a8f9e"],[z=>z>=57&&z<=71,"#a2578f"],[z=>z>=89&&z<=103,"#8a4a6a"]];
const col=z=>(cats.find(c=>c[0](z))||[0,"#3d6fd0"])[1];
function pos(z){
 if(z==1)return[1,1];if(z==2)return[1,18];
 if(z<=4)return[2,z-2];if(z<=10)return[2,z+8];
 if(z<=12)return[3,z-10];if(z<=18)return[3,z];
 if(z<=36)return[4,z-18];if(z<=54)return[5,z-36];
 if(z<=56)return[6,z-54];if(z<=71)return[9,z-54];
 if(z<=86)return[6,z-68];if(z<=88)return[7,z-86];
 if(z<=103)return[10,z-86];return[7,z-100];
}
const pt=$('pt');
S.forEach((s,i)=>{const z=i+1,[r,c]=pos(z),d=document.createElement('div');d.className='el';d.dataset.z=z;d.style.gridRow=r;d.style.gridColumn=c;d.style.background=col(z);d.innerHTML=`<b>${s}</b><small>${N[i]}</small>`;pt.appendChild(d)});

/* ---- reactions ---- */
const sub=s=>s.replace(/\d/g,d=>"₀₁₂₃₄₅₆₇₈₉"[d]);
const parse=f=>[...f.matchAll(/([A-Z][a-z]?)(\d*)/g)].map(m=>[m[1],+(m[2]||1)]);
const fm=c=>c.map(([s,n])=>s+(n>1?n:"")).join("");
const REC=[["Fe3O4","四氧化三鐵","鐵絲在純氧中燃燒，火花四射，生成黑色固體"],["FeO","氧化亞鐵","鐵的另一種氧化物，黑色粉末"],["Cu2O","氧化亞銅","紅色的氧化物，常見於紅色顏料"],["NH4Cl","氯化銨","氨和氯化氫結合成的白色鹽類，常用於乾電池"],["Na2CO3","碳酸鈉","蘇打，可用來製玻璃與清潔劑"],["NaHCO3","碳酸氫鈉","小蘇打，烘焙與清潔常用，受熱會產生二氧化碳"],["O3","臭氧","三個氧原子結合成臭氧,有特殊氣味,能吸收紫外線"],["H2O","水","氫在氧中燃燒生成水,是生命不可或缺的分子"],["H2O2","過氧化氫(雙氧水)","比水多一個氧,常用來消毒與漂白"],["CO2","二氧化碳","碳完全燃燒的產物,也是光合作用的原料"],["CO","一氧化碳","碳不完全燃燒產生的有毒氣體"],["CH4","甲烷","最簡單的碳氫化合物,天然氣的主要成分"],["C2H6O","乙醇","酒精的主要成分"],["C6H12O6","葡萄糖","生物體最重要的能量來源之一"],["NH3","氨","有刺鼻氣味,是肥料的重要原料"],["NO2","二氧化氮","棕紅色有毒氣體,常見於汽機車廢氣"],["HNO3","硝酸","強酸,具有強氧化性"],["SO2","二氧化硫","硫燃燒生成,有刺激性氣味"],["H2SO4","硫酸","工業之母,強酸,腐蝕性極強"],["H2S","硫化氫","有臭雞蛋味的氣體"],["HCl","氯化氫","溶於水就是鹽酸"],["HF","氟化氫","溶於水為氫氟酸,能腐蝕玻璃"],["SiO2","二氧化矽","石英與沙子的主要成分"],["CaCO3","碳酸鈣","石灰岩、大理石與貝殼的主要成分"]].map(r=>({f:r[0],n:r[1],d:r[2],c:parse(r[0])})).sort((a,b)=>b.c.reduce((x,y)=>x+y[1],0)-a.c.reduce((x,y)=>x+y[1],0));
const ALK=["Li","Na","K","Rb","Cs"],CAT={Li:1,Na:1,K:1,Rb:1,Cs:1,Ag:1,Be:2,Mg:2,Ca:2,Sr:2,Ba:2,Zn:2,Cu:2,Fe:3,Al:3,Ga:3},ANI={F:1,Cl:1,Br:1,I:1,O:2,S:2,N:3},DI=["H","N","O","F","Cl","Br","I"];
const BOOM=[...ALK,"Mg","Ca","Sr","Ba"];
const gcd=(a,b)=>b?gcd(b,a%b):a;
const zOf=s=>S.indexOf(s)+1;
function step0(c){if(!NOREC&&!NOCOMB)for(const r of COMB){const m=Math.min(...r.c.map(([s,n])=>Math.floor((c[s]||0)/n)));if(m>0){r.c.forEach(([s,n])=>c[s]-=n*m);return{m,n:r.n,eq:r.eq,multi:r.p.map(([f,k])=>{const q=REC.find(x=>x.f==f);return{f,n:q.n,d:q.d,c:q.c,k}})}}}
 for(const k of ALK){if(c.C>0&&c.O>=3)break;const m=Math.min(c[k]||0,c.H||0,c.O||0);if(m>0){c[k]-=m;c.H-=m;c.O-=m;return{m,f:k+"OH",n:"氫氧化"+N[zOf(k)-1],d:"活潑的鹼金屬遇水猛烈反應,放熱、冒氣並可能爆炸",c:[[k,1],["O",1],["H",1]],boom:1}}}
 for(const r of REC){if(NOREC)break;const m=Math.min(...r.c.map(([s,n])=>Math.floor((c[s]||0)/n)));if(m>0){r.c.forEach(([s,n])=>c[s]-=n*m);return{m,f:r.f,n:r.n,d:r.d,c:r.c}}}
 for(const a in ANI)if(c[a]>0)for(const k in CAT)if(c[k]>0){const va=ANI[a],vc=CAT[k],g=gcd(va,vc),nk=va/g,na=vc/g,m=Math.min(Math.floor(c[k]/nk),Math.floor(c[a]/na));if(m>0){c[k]-=nk*m;c[a]-=na*m;const p=[[k,nk],[a,na]];const pre=a=="O"?"氧":N[zOf(a)-1];return{m,f:fm(p),n:pre+"化"+N[zOf(k)-1],d:"金屬與非金屬透過電子轉移結合成離子化合物",c:p,boom:BOOM.includes(k)}}}
 for(const s of DI)if(!NOREC&&c[s]>=2){const m=Math.floor(c[s]/2);c[s]-=2*m;return{m,f:s+"2",n:N[zOf(s)-1]+"分子",d:"兩個原子共用電子,形成穩定的雙原子分子",c:[[s,2]]}}
 return null}
let NOREC=0,NOCOMB=0;
function step(c){const r=step0(c);if(r||!NOREC)return r;NOREC=0;return step0(c)}
function calc(c0){const u=r=>r.mols.reduce((x,m)=>x+m.comp.reduce((y,z)=>y+z[1],0),0);let best=null,bu=-1;for(const[a,b]of[[0,0],[1,0],[0,1],[1,1]]){NOREC=a;NOCOMB=b;const r=calc1(c0),v=u(r);if(v>bu){best=r;bu=v}}NOREC=0;NOCOMB=0;return best}
function calc1(c0){
 const c={...c0},mols=[],seen={};let boom=0,rad=0,msg=[];let p;
 while(p=step(c)){if(p.multi){msg.push("🔥 <b>"+p.n+"</b>："+p.eq);p.multi.forEach(q=>{seen[q.f]=seen[q.f]||{p:q,k:0};seen[q.f].k+=p.m*q.k;for(let i=0;i<p.m*q.k;i++)mols.push({comp:q.c,f:q.f})});continue}boom|=!!p.boom;seen[p.f]=seen[p.f]||{p,k:0};seen[p.f].k+=p.m;for(let i=0;i<p.m;i++)mols.push({comp:p.c,f:p.f})}
 for(const s in c)if(c[s]>0){const z=zOf(s);
  if(s=="U"||s=="Pu"){boom=1;msg.push(`<b>${N[z-1]}</b>發生核分裂!原子核分裂並釋放巨大能量,這是核電廠與核彈的原理`)}
  else if(z>=84||z==43||z==61){rad=1;msg.push(`<b>${N[z-1]}</b>具有放射性,會自行衰變並釋放輻射`)}
  else if([2,10,18,36,54,86,118].includes(z))msg.push(`<b>${N[z-1]}</b>是惰性氣體,幾乎不與其他元素反應`)}
 const lines=Object.values(seen).map(({p,k})=>`<b>${sub(p.f)}</b> ${p.n} ×${k}:${p.d}`);
 if(boom&&lines.length)lines.push("⚠️ 反應十分劇烈!");
 if(!mols.length&&!msg.length)msg.push("這些元素之間沒有發生反應(或這個反應還沒收錄)");
 return{mols,boom,rad,prods:Object.values(seen).map(x=>x.p),html:[...lines,...msg].join("<br>")}}

/* ---- audio ---- */
let AC,mute=false;
const au=()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state=="suspended")AC.resume()}catch(e){}return AC};
function tone(f,d,type="sine",v=.15,f2,delay=0){const a=au();if(!a||mute)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+delay;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(mo(a));o.start(t);o.stop(t+d+.02)}
function noise(d,v=.3,fr=800){const a=au();if(!a||mute)return;const n=a.sampleRate*d|0,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type="lowpass";f.frequency.setValueAtTime(fr,a.currentTime);f.frequency.exponentialRampToValueAtTime(80,a.currentTime+d);g.gain.value=v;s.connect(f);f.connect(g);g.connect(mo(a));s.start()}
function heatSnd(){tone(110,1.1,"sawtooth",.05,420);noise(1.1,.08,1500)}
function boomSnd(){if(res.boom){noise(1.4,.7,3500);tone(110,1,"sine",.5,28);tone(60,.6,"square",.1,25)}else if(!mols.length)tone(180,.4,"sine",.1,120);else{[523,659,784,1047].forEach((f,i)=>tone(f,.5,"sine",.12,0,i*.07));noise(.25,.15,6000)}}
$('mu').onclick=()=>{mute=!mute;$('mu').textContent=mute?"🔇":"🔊"};
/* ---- reactor ---- */
const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr;
function rs(){dpr=Math.min(2,devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
rs();addEventListener('resize',rs);
let lt=0,pops=[],bg=Array.from({length:30},()=>({x:Math.random(),y:Math.random(),s:Math.random()*1.5+.5,v:Math.random()*.0004+.0001})),atoms=[],mols=[],parts=[],ph=0,t0=0,res=null,flash=0,shake=0,rings=[],last=0,fc=0;
